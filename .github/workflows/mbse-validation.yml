name: MBSE validation

on:
  pull_request:
    paths:
      - "model/**"
      - "scripts/**"
      - ".github/workflows/mbse-validation.yml"

jobs:
  model-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate model traceability
        run: bash scripts/validate-mbse.sh
